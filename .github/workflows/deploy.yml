name: Deploy to GitHub Pages

# Build the Vite app (landing/Rally at index.html, Match Point at
# matchpoint.html) and publish web/dist to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need these token scopes.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight Pages deploy at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs the `prebuild` hook (copy-data) first, which copies
      # the committed Parquet artifacts + palette from data/built into
      # web/public/data so Vite bundles them into dist/data, then `tsc && vite build`.
      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
